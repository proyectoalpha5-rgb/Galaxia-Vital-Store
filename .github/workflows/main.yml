name: Build Windows Installer
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generar icon.png 256x256 automatico
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap(256, 256)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = 'AntiAlias'
          $g.Clear([System.Drawing.Color]::Transparent)
          $bgBrush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(255, 12, 12, 24))
          $g.FillEllipse($bgBrush, 8, 8, 240, 240)
          $penCyan = New-Object System.Drawing.Pen([System.Drawing.Color]::FromArgb(255, 0, 229, 255), 8)
          $g.DrawEllipse($penCyan, 12, 12, 232, 232)
          $penPurple = New-Object System.Drawing.Pen([System.Drawing.Color]::FromArgb(255, 168, 85, 247), 6)
          $g.DrawEllipse($penPurple, 44, 44, 168, 168)
          $coreBrush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(255, 255, 215, 0))
          $g.FillEllipse($coreBrush, 108, 108, 40, 40)
          $bmp.Save("icon.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose()
          $bmp.Dispose()
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: Galaxia-Vital-Widget-Setup
          path: dist/*.exe
